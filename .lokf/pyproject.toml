# LOKF sidecar for KTL Registrar.
#
# A small Python "sidecar" that lets this repo validate and project its
# knowledge/ bundle with the `lokf` toolkit. It does not affect the plugin
# build (esbuild/TypeScript in the repo root).
#
#   uv sync             # install lokf into a local .venv
#   just lokf-validate  # validate knowledge/ against the LOKF schema
[project]
name = "ktl-registrar-knowledge"
version = "0.1.0"
description = "LOKF knowledge-bundle tooling for KTL Registrar."
# Keep in sync with the `lokf` toolkit's own requires-python floor.
requires-python = ">=3.10"
dependencies = [
    "lokf[build]>=0.8.0",
]

[tool.uv]
package = false
