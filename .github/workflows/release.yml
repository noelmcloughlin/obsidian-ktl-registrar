name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'
    # Invoked directly by semantic-release.yml's `build-and-attest` job right
    # after it pushes a new version tag. A tag pushed with the default
    # GITHUB_TOKEN does not itself re-trigger the `push: tags:` event above
    # (GitHub's own loop prevention). workflow_call sidesteps that, and a
    # hand-pushed tag still goes through the trigger above unchanged, so
    # either path builds, attests, and opens the same draft release.
    workflow_call:
        inputs:
            tag:
                description: 'Version tag to build and release (bare, no leading v)'
                required: true
                type: string
    # Run by hand from the Actions tab when semantic-release pushed the tag but
    # failed before build-and-attest. Pushing that tag again starts nothing,
    # because it names the release commit, whose message carries [skip ci].
    workflow_dispatch:
        inputs:
            tag:
                description: 'Version tag to build and release (bare, no leading v)'
                required: true
                type: string

# Least-privilege default: every scope starts read-only (or none). The build
# job below opts back into exactly the three write scopes it needs; no other
# job (present or future) inherits them.
permissions: {}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            # Monitors the runner's outbound network traffic for the rest of this
            # job and flags anything unexpected. It is the main defense this
            # workflow has against a compromised dependency's postinstall script
            # (`npm ci` below runs esbuild's, which fetches a platform binary)
            # trying to exfiltrate GITHUB_TOKEN or phone home. Audit mode only:
            # it observes and reports, it does not block, since hand-maintaining
            # an exact egress allowlist here would be fragile against ordinary
            # dependency churn. See
            # https://github.com/step-security/harden-runner.
            - name: Harden the runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - name: Check out the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.tag || github.ref_name }}
                  persist-credentials: false

            # Obsidian matches a release to a plugin version by tag name, exact
            # string equality against manifest.json's "version": no "v" prefix,
            # no partial match. Catch a mistagged push (e.g. `v0.2.0` instead of
            # `0.2.0`) here, before spending a build + attestation on a release
            # Obsidian's installer would never find.
            # The tag reaches the shell through the environment, never through
            # ${{ }} interpolation. A tag name is free-form text, and git permits
            # `$`, backticks and quotes in one, so interpolating it directly into
            # a run: block would let a pushed tag execute here.
            - name: Verify tag matches manifest version
              env:
                  TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$TAG" != "$version" ]; then
                    echo "::error::Tag '$TAG' does not match manifest.json version '$version'. Obsidian requires the release tag to equal the version exactly, with no leading 'v'. Delete this tag, then re-tag as '$version' (see CONTRIBUTING.md's release flow)."
                    exit 1
                  fi

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                    gh release create "$TAG" \
                        --title="$TAG" \
                        --draft \
                        main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
