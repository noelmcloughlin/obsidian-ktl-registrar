name: Lint & docs

# Static checks for the shell, workflows, and prose this repo ships. These
# never touch the Node build (see build.yml) or the LOKF bundle's own
# semantics (see knowledge-registrar.yaml) - this is the CI-hardening pass
# backported from knowledge-trust-ladder's validate.yml (FIXES.md F1-F3).
on:
  # push and pull_request both firing on every branch used to run this
  # workflow twice for the same commit - once on landing, again when the PR
  # using that branch opened or synchronized, since the two events aren't
  # deduplicated by SHA (concurrency doesn't catch it either: github.ref
  # differs between a push and a pull_request event for the same commit).
  # push is scoped to main, matching validate.yml/semantic-release.yml
  # elsewhere in this family - an open PR can never have main as its head, so
  # the two triggers can no longer cover the same commit.
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC, to catch link rot without a PR.
  workflow_dispatch:

# Least-privilege default, as in the other workflows.
permissions: {}

concurrency:
  group: lint-and-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color
      # actionlint checks syntax, not pinning. A tag or branch ref floats, so
      # every `uses:` must name a commit SHA (or an image digest), with the
      # version in a trailing comment for Dependabot to bump.
      - name: Every action is pinned to a commit
        run: |
          if grep -rnE '^\s*-?\s*uses:' .github/workflows/ \
            | grep -vE '@([0-9a-f]{40}|sha256:[0-9a-f]{64})\b' \
            | grep -vE 'uses:\s*\./'; then
            echo '::error::the action(s) above are not pinned to a commit SHA' >&2
            exit 1
          fi

  validate-markdown:
    name: Lint Markdown & check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
          config: .markdownlint-cli2.jsonc
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress "**/*.md"
          fail: true
      - name: codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          path: '**/*.md'
