name: Semantic release

# Computes the next version from Conventional Commits on `main`, promotes
# this repository's own CHANGELOG.md "## [Unreleased]" section into a dated
# version heading, and bumps manifest.json/package.json/versions.json the
# same way `npm version` already does by hand (see CONTRIBUTING.md
# "Releasing") - via .github/scripts/changelog-release.mjs, run as
# semantic-release's own verifyRelease/generateNotes/prepare hooks. Building
# the plugin, attesting provenance, and opening the draft GitHub release
# stay exactly where they already were: the `release` job below hands off
# to release.yml (unchanged, still also tag-triggered for a hand-pushed
# tag) rather than duplicating any of it.
#
# `plan` previews every pull request into main with `--dry-run` - which
# writes nothing and needs no write scope - so a broken commit message or a
# broken exec script is caught in review, not after merge. `release` runs
# only on a push to main and sits behind the `release` GitHub Environment:
# configure required reviewers on it in this repository's own
# Settings > Environments (creating the environment here does not do that
# for you), the same gate the sibling skills repository's publish workflow
# already uses, or every qualifying merge to main will cut a release with no
# human step in between.
#
# semantic-release itself is installed fresh, at exact pinned versions,
# rather than added to package.json: this repository's own runtime
# dependency tree - and every `npm ci` in build.yml - never carries the
# release tool's, only this one workflow's two jobs do.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install semantic-release (pinned, not a project dependency)
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            semantic-release@25.0.9 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/npm@13.1.5 \
            @semantic-release/git@11.0.1

      # Would these commits release? The types are .releaserc.json's: the
      # Angular preset's feat/fix plus this repository's `security`, and any
      # type marked breaking by a `!` or a BREAKING CHANGE footer. Both checks
      # below key off this one answer.
      - name: Read whether these commits would release
        id: commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git log --format='%s%n%b' "$BASE..HEAD" \
            | grep -qE '^((feat|fix|security)(\([^)]*\))?!?:|[a-z]+(\([^)]*\))?!:|BREAKING CHANGE:)'; then
            echo "releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "releases=false" >> "$GITHUB_OUTPUT"
            echo "No feat/fix/security or breaking commit here, so this pull request releases nothing."
          fi

      # semantic-release detects a pull_request event itself and exits before
      # running any plugin, including @semantic-release/exec's verifyRelease
      # hook - so the --dry-run below never calls changelog-release.mjs check
      # on this event, and an empty "## [Unreleased]" would otherwise pass a
      # pull request and only fail at release time. Call it directly - but
      # only when these commits would actually release, or a chore-only pull
      # request (a Dependabot bump, a docs tidy) fails for lacking notes it
      # was never meant to write.
      - name: Refuse an empty changelog entry when these commits would release
        if: steps.commits.outputs.releases == 'true'
        run: node .github/scripts/changelog-release.mjs check

      # A squash merge takes its commit subject from the pull request title,
      # and GitHub's default title is the branch name in words, which carries
      # no type - so a typed `fix:` commit reaches main as "Fix the thing (#12)"
      # and releases nothing, leaving its notes stranded in "## [Unreleased]".
      # So when the commits would release, the title must too: then either
      # merge strategy releases. The title is read through `env:`, never
      # interpolated into the script, since anyone can open a pull request.
      - name: Refuse a title that would lose the release on a squash merge
        if: steps.commits.outputs.releases == 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s\n' "$TITLE" \
            | grep -qE '^((feat|fix|security)(\([^)]*\))?!?:|[a-z]+(\([^)]*\))?!:)'; then
            echo "Title carries a releasing type, so a squash merge releases too."
          else
            echo "::error::These commits would release, but the pull request title '$TITLE' has no releasing type (feat:, fix:, security:, or a breaking '!'). A squash merge uses the title as the commit subject and would release nothing - retitle the pull request, or use a merge commit."
            exit 1
          fi

      - name: Preview the next release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release --dry-run

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # This job's own job is to push a commit and a tag to `main`, so -
      # unlike the read-only jobs elsewhere in this repository - it keeps
      # the checkout action's default credential helper rather than passing
      # persist-credentials: false. That's safe here for the same reason
      # it's safe in knowledge-librarian.yaml's write-scoped "publish" job:
      # nothing untrusted runs in this job, only the pinned release tool
      # above and this repository's own reviewed script below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install semantic-release (pinned, not a project dependency)
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            semantic-release@25.0.9 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/npm@13.1.5 \
            @semantic-release/git@11.0.1

      - name: Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx --no-install semantic-release

  build-and-attest:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.version }}
