name: Node.js build

on:
    # push and pull_request both firing on every branch used to run this
    # workflow twice for the same commit: once when it landed on the branch,
    # again when its PR opened or synchronized. The two events are not
    # deduplicated by SHA. push is scoped to main, matching
    # validate.yml/semantic-release.yml elsewhere in this family: an open PR
    # can never have main as its head, so the two triggers can no longer
    # cover the same commit. A branch pushed before its PR exists goes
    # untested until the PR opens. That is acceptable given CONTRIBUTING.md's
    # own convention that changes reach main by pull request; workflow_dispatch
    # remains for anyone who wants a result sooner.
    push:
        branches: [main]
    pull_request:
        branches: ['**']

# Least-privilege default: every scope starts read-only (or none). The build
# job below opts back into only the read access it needs to check out code;
# no other job (present or future) inherits more. `pull_request` (not
# `pull_request_target`) already keeps a fork PR's GITHUB_TOKEN read-only and
# its run secret-free, regardless of this setting. This is defense in depth,
# not what makes fork PRs safe here.
permissions: {}

# Cancel a superseded run on the same ref (a rapid re-push to an open PR, or
# to main) to save runner time; no run outlives the commit it was testing.
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            # Monitors the runner's outbound network traffic for the rest of this
            # job and flags anything unexpected. It is the main defense here
            # against a compromised dependency's postinstall script phoning home
            # (`npm ci` below runs esbuild's, which fetches a platform binary).
            # That is doubly relevant on a job that also builds arbitrary fork
            # PR branches. Audit mode only: it observes and reports, it does not
            # block, since hand-maintaining an exact egress allowlist here would
            # be fragile against ordinary dependency churn. See
            # https://github.com/step-security/harden-runner.
            - name: Harden the runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            # validator.ts is import-free, so its rules run under plain Node here
            # without an Obsidian install.
            - run: npm run smoke-test
